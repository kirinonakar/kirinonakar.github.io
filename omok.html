<!DOCTYPE html>
<html lang='ko'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>오목 (Gomoku)</title>
<style>
*{box-sizing:border-box}
:root{--bg:#14161a;--panel:#1e2128;--line:#2c303a;--txt:#e9ebf0;--muted:#98a0b0;--accent:#4b7dff}
body{margin:0;font-family:'Segoe UI','Malgun Gothic',system-ui,sans-serif;color:var(--txt);
  background:radial-gradient(1100px 520px at 18% -12%,#252b39,#111318 62%);min-height:100vh}
.app{max-width:1000px;margin:0 auto;padding:22px 16px 48px}
h1{margin:0 0 6px;font-size:20px;letter-spacing:.4px}
.sub{margin:0 0 18px;color:var(--muted);font-size:13px}
main{display:grid;grid-template-columns:auto 300px;gap:22px;align-items:start}
@media(max-width:880px){main{grid-template-columns:1fr}}
.board-wrap{display:flex;flex-direction:column;gap:12px;max-width:100%}
.canvas-wrap{width:clamp(280px,min(74vw,62vh),600px);aspect-ratio:1/1;max-width:100%}
canvas{width:100%;height:100%;display:block;border-radius:12px;cursor:pointer;touch-action:manipulation;outline:none;
  box-shadow:0 20px 44px rgba(0,0,0,.5),0 0 0 1px var(--line)}
canvas:focus-visible{box-shadow:0 20px 44px rgba(0,0,0,.5),0 0 0 3px var(--accent)}
.bar{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
  border-radius:11px;padding:10px 14px}
.ind{width:12px;height:12px;border-radius:50%;border:1px solid #000;flex:none}
.ind.b{background:#23262e}
.ind.w{background:#f2f2f2}
.status{font-size:14px;font-weight:600}
.meta{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.panel{display:flex;flex-direction:column;gap:14px;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:14px}
.field{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
select,button{font:inherit;color:var(--txt);background:#262a34;border:1px solid var(--line);border-radius:9px;
  padding:8px 10px;cursor:pointer}
select{width:100%}
button:hover:not(:disabled){filter:brightness(1.15)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:linear-gradient(#4b7dff,#2f5ad6);border-color:#3c66e0}
.hint{font-size:12px;color:var(--muted);line-height:1.6;margin:0}
.hint b{color:#cfd5e2;font-weight:600}
</style>
</head>
<body>
<div class='app'>
  <h1>오목 (Gomoku)</h1>
  <p class='sub'>15×15 · 5목 승리 · 마우스 / 터치 / 키보드(방향키 + Enter)</p>
  <main>
    <div class='board-wrap'>
      <div class='bar'>
        <span class='ind b' id='ind'></span>
        <span class='status' id='status'>흑 차례</span>
        <span class='meta' id='meta'>0수</span>
      </div>
      <div class='canvas-wrap'><canvas id='board' tabindex='0' aria-label='오목판'></canvas></div>
    </div>
    <aside class='panel'>
      <div class='field'>
        <label for='mode'>대국 모드</label>
        <select id='mode'>
          <option value='pvp'>2인 대국</option>
          <option value='ai'>컴퓨터 대전 (백)</option>
        </select>
      </div>
      <button id='undo'>무르기</button>
      <button id='restart' class='primary'>다시 시작</button>
      <p class='hint'>흑이 먼저 두고 <b>가로·세로·대각 5목</b>이면 승리합니다.<br>
        컴퓨터 대전에서 나는 <b>흑</b>입니다. 방향키로 이동, Enter로 착수.</p>
    </aside>
  </main>
</div>
<script>
const N = 15, EMPTY = 0, BLACK = 1, WHITE = 2, TAU = Math.PI * 2;
const DIRS = [[0, 1], [1, 0], [1, 1], [1, -1]];
const STARS = [[3, 3], [3, 11], [11, 3], [11, 11], [7, 7]];

const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const elInd = document.getElementById('ind');
const elStatus = document.getElementById('status');
const elMeta = document.getElementById('meta');
const elMode = document.getElementById('mode');
const elUndo = document.getElementById('undo');

let board = new Int8Array(N * N);
let moves = [];
let turn = BLACK;
let gameOver = false;
let winLine = null;
let hover = null;
let cursor = { r: 7, c: 7 };
let focused = false;
let aiThinking = false;
let mode = 'pvp';
let boardSize = 0, cell = 0, margin = 0;

const px = i => margin + i * cell;
const inB = (r, c) => r >= 0 && r < N && c >= 0 && c < N;
const at = (r, c) => board[r * N + c];

/* ---------- 레이아웃 / 렌더링 ---------- */
function layout() {
  const rect = canvas.getBoundingClientRect();
  if (!rect.width) return;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  boardSize = rect.width;
  cell = boardSize / (N + 1);
  margin = cell;
  draw();
}

function draw() {
  if (!boardSize) return;
  const s = boardSize;

  // 바탕
  const g = ctx.createLinearGradient(0, 0, s, s);
  g.addColorStop(0, '#eccb95');
  g.addColorStop(.5, '#e0b478');
  g.addColorStop(1, '#cf9d5a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);

  const v = ctx.createRadialGradient(s * .5, s * .45, s * .15, s * .5, s * .5, s * .8);
  v.addColorStop(0, 'rgba(255,255,255,.18)');
  v.addColorStop(1, 'rgba(80,45,10,.20)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, s, s);

  // 격자
  ctx.strokeStyle = 'rgba(92,62,26,.62)';
  ctx.lineWidth = Math.max(1, cell * 0.028);
  for (let i = 0; i < N; i++) {
    ctx.beginPath(); ctx.moveTo(px(0), px(i)); ctx.lineTo(px(N - 1), px(i)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(px(i), px(0)); ctx.lineTo(px(i), px(N - 1)); ctx.stroke();
  }
  ctx.lineWidth = Math.max(1.4, cell * 0.05);
  ctx.strokeRect(px(0), px(0), px(N - 1) - px(0), px(N - 1) - px(0));

  // 화점
  ctx.fillStyle = 'rgba(70,45,15,.85)';
  for (const [r, c] of STARS) {
    ctx.beginPath();
    ctx.arc(px(c), px(r), cell * 0.085, 0, TAU);
    ctx.fill();
  }

  // 돌
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      const v2 = at(r, c);
      if (v2) stone(r, c, v2, 1);
    }
  }

  // 착수 예고
  if (hover && !gameOver && !aiThinking && !at(hover.r, hover.c) && canPlay()) {
    stone(hover.r, hover.c, turn, .38);
  }

  // 마지막 수 표시
  const last = moves[moves.length - 1];
  if (last) {
    ctx.beginPath();
    ctx.arc(px(last.c), px(last.r), cell * 0.1, 0, TAU);
    ctx.fillStyle = '#e0483a';
    ctx.fill();
  }

  // 승리 라인
  if (winLine) drawWin(winLine);

  // 키보드 커서
  if (focused && !gameOver) {
    ctx.strokeStyle = 'rgba(75,125,255,.95)';
    ctx.lineWidth = Math.max(1.5, cell * 0.06);
    ctx.beginPath();
    ctx.arc(px(cursor.c), px(cursor.r), cell * 0.44, 0, TAU);
    ctx.stroke();
  }
}

function stone(r, c, color, alpha) {
  const x = px(c), y = px(r), rad = cell * 0.45;
  ctx.save();
  ctx.globalAlpha = alpha;

  ctx.beginPath();
  ctx.arc(x + cell * 0.045, y + cell * 0.055, rad, 0, TAU);
  ctx.fillStyle = 'rgba(50,32,10,.25)';
  ctx.fill();

  const gr = ctx.createRadialGradient(x - rad * .35, y - rad * .38, rad * .12, x, y, rad);
  if (color === BLACK) {
    gr.addColorStop(0, '#737983');
    gr.addColorStop(.45, '#2b2f36');
    gr.addColorStop(1, '#0b0d11');
  } else {
    gr.addColorStop(0, '#ffffff');
    gr.addColorStop(.6, '#f1f2f5');
    gr.addColorStop(1, '#c7cad1');
  }
  ctx.beginPath();
  ctx.arc(x, y, rad, 0, TAU);
  ctx.fillStyle = gr;
  ctx.fill();
  ctx.lineWidth = 1;
  ctx.strokeStyle = color === BLACK ? 'rgba(0,0,0,.55)' : 'rgba(120,124,134,.7)';
  ctx.stroke();
  ctx.restore();
}

function drawWin(line) {
  let a = line[0], b = line[0], best = -1;
  for (const p of line) {
    for (const q of line) {
      const d = (p.r - q.r) ** 2 + (p.c - q.c) ** 2;
      if (d > best) { best = d; a = p; b = q; }
    }
  }
  ctx.save();
  ctx.strokeStyle = 'rgba(214,60,48,.8)';
  ctx.lineWidth = Math.max(2, cell * 0.05);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(px(a.c), px(a.r));
  ctx.lineTo(px(b.c), px(b.r));
  ctx.stroke();

  ctx.strokeStyle = 'rgba(238,72,58,.95)';
  ctx.lineWidth = Math.max(2, cell * 0.06);
  for (const p of line) {
    ctx.beginPath();
    ctx.arc(px(p.c), px(p.r), cell * 0.47, 0, TAU);
    ctx.stroke();
  }
  ctx.restore();
}

/* ---------- 게임 규칙 ---------- */
function findWin(r, c, color) {
  for (const [dr, dc] of DIRS) {
    const cells = [{ r, c }];
    for (const s of [1, -1]) {
      let i = r + dr * s, j = c + dc * s;
      while (inB(i, j) && at(i, j) === color) {
        cells.push({ r: i, c: j });
        i += dr * s;
        j += dc * s;
      }
    }
    if (cells.length >= 5) return cells;
  }
  return null;
}

function canPlay() {
  if (gameOver || aiThinking) return false;
  if (mode === 'ai' && turn === WHITE) return false;
  return true;
}

function place(r, c, color) {
  board[r * N + c] = color;
  moves.push({ r, c, color });

  const line = findWin(r, c, color);
  if (line) {
    winLine = line;
    gameOver = true;
  } else if (moves.length >= N * N) {
    gameOver = true;
  } else {
    turn = color === BLACK ? WHITE : BLACK;
  }

  updateUI();
  draw();

  if (!gameOver && mode === 'ai' && turn === WHITE) aiTurn();
}

function tryPlace(r, c) {
  if (!inB(r, c) || at(r, c) || !canPlay()) return;
  place(r, c, turn);
}

function undo() {
  if (aiThinking || !moves.length) return;
  const n = (mode === 'ai' && moves.length >= 2) ? 2 : 1;
  for (let i = 0; i < n; i++) {
    const m = moves.pop();
    if (m) board[m.r * N + m.c] = EMPTY;
  }
  gameOver = false;
  winLine = null;
  const last = moves[moves.length - 1];
  turn = last ? (last.color === BLACK ? WHITE : BLACK) : BLACK;
  updateUI();
  draw();
}

function restart() {
  board = new Int8Array(N * N);
  moves = [];
  turn = BLACK;
  gameOver = false;
  winLine = null;
  hover = null;
  aiThinking = false;
  cursor = { r: 7, c: 7 };
  updateUI();
  draw();
}

/* ---------- 컴퓨터(간단 휴리스틱) ---------- */
function patScore(cnt, open) {
  if (cnt >= 5) return 1e7;
  if (cnt === 4) return open === 2 ? 1e6 : open === 1 ? 1e4 : 0;
  if (cnt === 3) return open === 2 ? 1e4 : open === 1 ? 900 : 0;
  if (cnt === 2) return open === 2 ? 700 : open === 1 ? 90 : 0;
  return open === 2 ? 45 : open === 1 ? 9 : 0;
}

function evalCell(r, c, color) {
  let total = 0;
  for (const [dr, dc] of DIRS) {
    let cnt = 1, open = 0, i, j;
    i = r + dr; j = c + dc;
    while (inB(i, j) && at(i, j) === color) { cnt++; i += dr; j += dc; }
    if (inB(i, j) && at(i, j) === EMPTY) open++;
    i = r - dr; j = c - dc;
    while (inB(i, j) && at(i, j) === color) { cnt++; i -= dr; j -= dc; }
    if (inB(i, j) && at(i, j) === EMPTY) open++;
    total += patScore(cnt, open);
  }
  return total;
}

function nearStone(r, c, dist) {
  for (let dr = -dist; dr <= dist; dr++) {
    for (let dc = -dist; dc <= dist; dc++) {
      const i = r + dr, j = c + dc;
      if (inB(i, j) && at(i, j)) return true;
    }
  }
  return false;
}

function bestMove(color) {
  const opp = color === BLACK ? WHITE : BLACK;
  let stones = 0;
  for (let i = 0; i < board.length; i++) if (board[i]) stones++;
  if (!stones) return { r: 7, c: 7 };

  let best = null, bestScore = -Infinity;
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      if (at(r, c) !== EMPTY || !nearStone(r, c, 2)) continue;
      const own = evalCell(r, c, color);
      const dfn = evalCell(r, c, opp);
      let s;
      if (own >= 5e6) s = 1e9 + own;                 // 즉시 이기는 수
      else if (dfn >= 5e6) s = 8e8 + dfn;            // 상대 5목 차단
      else s = own + dfn * 1.05;
      s += (7 - Math.max(Math.abs(r - 7), Math.abs(c - 7))) * 3;
      s += Math.random() * 6;
      if (s > bestScore) { bestScore = s; best = { r, c }; }
    }
  }
  return best;
}

function aiTurn() {
  aiThinking = true;
  updateUI();
  draw();
  setTimeout(() => {
    const mv = bestMove(WHITE);
    aiThinking = false;
    if (mv) place(mv.r, mv.c, WHITE);
    else { gameOver = true; updateUI(); draw(); }
  }, 220);
}

/* ---------- UI ---------- */
function updateUI() {
  const last = moves[moves.length - 1];
  const shown = last ? last.color : BLACK;
  elInd.className = 'ind ' + (shown === BLACK ? 'b' : 'w');

  if (gameOver) {
    if (winLine) {
      const w = at(winLine[0].r, winLine[0].c);
      elStatus.textContent = (w === BLACK ? '흑' : '백') + ' 승리!';
    } else {
      elStatus.textContent = '무승부';
    }
  } else if (aiThinking) {
    elStatus.textContent = '컴퓨터 생각 중…';
  } else {
    let t = (turn === BLACK ? '흑' : '백') + ' 차례';
    if (mode === 'ai') t += turn === BLACK ? ' (나)' : ' (컴퓨터)';
    elStatus.textContent = t;
  }

  elMeta.textContent = moves.length + '수';
  elUndo.disabled = !moves.length || aiThinking;
}

/* ---------- 입력 ---------- */
function cellFromEvent(e) {
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  const c = Math.round((x - margin) / cell);
  const r = Math.round((y - margin) / cell);
  return inB(r, c) ? { r, c } : null;
}

canvas.addEventListener('pointermove', e => {
  if (e.pointerType && e.pointerType !== 'mouse') return;
  const p = cellFromEvent(e);
  if ((p && hover && p.r === hover.r && p.c === hover.c) || (!p && !hover)) return;
  hover = p;
  if (!focused) draw();
});

canvas.addEventListener('pointerleave', () => {
  if (hover) { hover = null; draw(); }
});

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  canvas.focus({ preventScroll: true });
  const p = cellFromEvent(e);
  if (p) { cursor = p; tryPlace(p.r, p.c); }
});

canvas.addEventListener('focus', () => { focused = true; draw(); });
canvas.addEventListener('blur', () => { focused = false; draw(); });

canvas.addEventListener('keydown', e => {
  const map = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
  if (map[e.key]) {
    const [dr, dc] = map[e.key];
    cursor = {
      r: Math.min(N - 1, Math.max(0, cursor.r + dr)),
      c: Math.min(N - 1, Math.max(0, cursor.c + dc))
    };
    hover = cursor;
    e.preventDefault();
    draw();
    return;
  }
  if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
    e.preventDefault();
    tryPlace(cursor.r, cursor.c);
  }
});

elMode.addEventListener('change', () => {
  mode = elMode.value;
  restart();
});
elUndo.addEventListener('click', undo);
document.getElementById('restart').addEventListener('click', restart);

/* ---------- 시작 ---------- */
new ResizeObserver(layout).observe(canvas.parentElement);
window.addEventListener('resize', layout);
mode = elMode.value;
updateUI();
layout();
</script>
</body>
</html>
