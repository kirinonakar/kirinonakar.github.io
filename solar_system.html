<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>태양계 시뮬레이터 · Three.js</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', system-ui, sans-serif; }
  #app { position: fixed; inset: 0; }
  .ui {
    position: fixed; z-index: 10; color: #fff; pointer-events: none;
    text-shadow: 0 2px 8px rgba(0,0,0,.8);
  }
  .top-left { top: 20px; left: 24px; }
  h1 { font-size: 20px; font-weight: 600; letter-spacing: .5px; margin-bottom: 6px; }
  h1 span { color: #ffb347; }
  .hint { font-size: 12.5px; opacity: .75; line-height: 1.6; }
  .panel {
    bottom: 20px; left: 24px; pointer-events: auto;
    background: rgba(255,255,255,.06); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.12); border-radius: 14px;
    padding: 14px 18px; display: flex; gap: 16px; align-items: center;
  }
  .panel label { font-size: 12.5px; opacity: .8; }
  .panel input[type=range] { width: 130px; accent-color: #ffb347; }
  .panel button {
    pointer-events: auto; cursor: pointer; color: #fff;
    background: rgba(255,179,71,.85); border: none; border-radius: 8px;
    padding: 7px 14px; font-size: 12.5px; font-weight: 600;
  }
  .panel button:hover { background: rgba(255,179,71,1); }
  .val { font-variant-numeric: tabular-nums; min-width: 34px; text-align: right; }
</style>
</head>
<body>
<div id="app"></div>

<div class="ui top-left">
  <h1>태양계 <span>Solar System</span></h1>
  <div class="hint">마우스 드래그: 회전 &nbsp;·&nbsp; 휠: 확대/축소 &nbsp;·&nbsp; 우측 마우스 드래그: 이동<br>※ 크기·거리·속도는 가시성을 위해 비례 조정됨</div>
</div>

<div class="ui panel">
  <button id="pauseBtn">⏸ 일시정지</button>
  <label>시간 배속 <input type="range" id="speed" min="0" max="400" value="100"> <span class="val" id="speedVal">1.0×</span></label>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ---------- 기본 설정 ----------
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 4000);
camera.position.set(0, 90, 220);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.getElementById('app').appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 30;
controls.maxDistance = 900;

// ---------- 조명 ----------
scene.add(new THREE.AmbientLight(0x8888aa, 0.18));
const sunLight = new THREE.PointLight(0xffddaa, 2.0, 0, 2);
scene.add(sunLight);

// ---------- 텍스처 생성 유틸 (외부 파일 없이 캔버스에서 직접 제작) ----------
function planetTexture(base, type, hue) {
  const w = 512, h = 256;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.fillStyle = base; ctx.fillRect(0, 0, w, h);
  if (type === 'bands') {                       // 목성·토성 계열: 가로 줄무늬
    for (let y = 0; y < h; y += 6) {
      const l = 50 + Math.sin(y * 0.12) * 22 + (Math.random() - 0.5) * 14;
      ctx.fillStyle = `hsl(${hue}, 45%, ${l}%)`;
      ctx.fillRect(0, y, w, 6);
    }
  } else {                                        // rocky: 반점·크레이터 느낌
    for (let i = 0; i < 900; i++) {
      const x = Math.random() * w, y = Math.random() * h, r = Math.random() * 6 + 1;
      const l = 45 + (Math.random() - 0.5) * 30;
      ctx.fillStyle = `hsla(${hue}, 40%, ${l}%, .5)`;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }
  }
  return new THREE.CanvasTexture(c);
}

function glowSprite(color, size) {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, color); g.addColorStop(0.4, color + '88'); g.addColorStop(1, 'transparent');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 128, 128);
  const mat = new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), blending: THREE.AdditiveBlending, transparent: true });
  const sp = new THREE.Sprite(mat); sp.scale.set(size, size, 1); return sp;
}

function label(text) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 64;
  const ctx = c.getContext('2d');
  ctx.font = 'bold 30px Segoe UI'; ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center';
  ctx.fillText(text, 128, 40);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true }));
  sp.scale.set(16, 4, 1); return sp;
}

// ---------- 항배경 (별) ----------
(function stars() {
  const geo = new THREE.BufferGeometry();
  const pts = [];
  for (let i = 0; i < 5000; i++) {
    const r = 1500, v = new THREE.Vector3(
      (Math.random() - .5) * r, (Math.random() - .5) * r, (Math.random() - .5) * r);
    if (v.length() < 60) v.multiplyScalar(2);
    pts.push(v.x, v.y, v.z);
  }
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  scene.add(new THREE.Points(geo, new THREE.PointsMaterial({ color: 0xffffff, size: 1.6, transparent: true, opacity: .9 })));
})();

// ---------- 태양 ----------
const sun = new THREE.Mesh(
  new THREE.SphereGeometry(12, 48, 48),
  new THREE.MeshBasicMaterial({ color: 0xffcc55 })
);
sun.add(glowSprite('#ffbb33', 60));
scene.add(sun);

// ---------- 행성 데이터 (시각적으로 조정된 값) ----------
const PLANETS = [
  { name:'수성', r:1.4,  dist:24,  speed:4.15, rot:.03,   color:'#b8a58f', tex:'rocky', hue:35 },
  { name:'금성', r:2.4,  dist:36,  speed:1.62, rot:.02,   color:'#e8c58f', tex:'rocky', hue:42 },
  { name:'지구', r:2.6,  dist:50,  speed:1.00, rot:.20,   color:'#3b7dd8', tex:'rocky', hue:210, moon:true },
  { name:'화성', r:1.9,  dist:64,  speed:.80,  rot:.18,   color:'#d1683c', tex:'rocky', hue:18 },
  { name:'목성', r:7.5,  dist:92,  speed:.44,  rot:.35,   color:'#d8b08a', tex:'bands', hue:32 },
  { name:'토성', r:6.4,  dist:120, speed:.30,  rot:.30,   color:'#e3d0a8', tex:'bands', hue:45, ring:true },
  { name:'천왕성', r:4.2, dist:150, speed:.20,  rot:.12,   color:'#9fd6e0', tex:'bands', hue:190, ring:true, tilt:80 },
  { name:'해왕성', r:4.0, dist:175, speed:.15,  rot:.12,   color:'#3f6fd8', tex:'bands', hue:225 },
];

const planetObjs = [];
PLANETS.forEach(p => {
  const pivot = new THREE.Group();           // 공전용 피벗
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(p.r, 40, 40),
    new THREE.MeshStandardMaterial({ map: planetTexture(p.color, p.tex, p.hue), roughness: .9, metalness: .1 })
  );
  mesh.position.x = p.dist;
  pivot.add(mesh);

  // 이름 라벨
  const lab = label(p.name); lab.position.set(p.dist, p.r + 4, 0); pivot.add(lab);

  // 기울기
  if (p.tilt) mesh.rotation.z = THREE.MathUtils.degToRad(p.tilt);

  // 고리
  if (p.ring) {
    const inner = p.r * 1.4, outer = p.r * 2.3;
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(inner, outer, 64),
      new THREE.MeshBasicMaterial({ color: p.color, side: THREE.DoubleSide, transparent: true, opacity: .75 })
    );
    ring.rotation.x = Math.PI / 2 - (p.tilt ? 1.0 : 0.35);
    mesh.add(ring);
  }

  // 지구 위성(달)
  if (p.moon) {
    const mPivot = new THREE.Group(); mesh.add(mPivot);
    const moon = new THREE.Mesh(new THREE.SphereGeometry(.6, 24, 24),
      new THREE.MeshStandardMaterial({ color: '#aaa9a5', roughness: 1 }));
    moon.position.x = p.r + 3.2; mPivot.add(moon); p.moonPivot = mPivot;
  }

  // 공전 궤도선
  const orbitGeo = new THREE.BufferGeometry();
  const seg = 128, arr = [];
  for (let i = 0; i <= seg; i++) {
    const a = (i / seg) * Math.PI * 2;
    arr.push(Math.cos(a) * p.dist, 0, Math.sin(a) * p.dist);
  }
  orbitGeo.setAttribute('position', new THREE.Float32BufferAttribute(arr, 3));
  scene.add(new THREE.Line(orbitGeo, new THREE.LineBasicMaterial({ color: 0x556070, transparent: true, opacity: .35 })));

  pivot.rotation.y = Math.random() * Math.PI * 2;   // 시작 각도 랜덤
  scene.add(pivot);
  planetObjs.push({ pivot, mesh, data: p });
});

// ---------- 소행성대 (목성·화성 사이) ----------
const beltCount = 1800;
const beltGeo = new THREE.DodecahedronGeometry(0.6, 0);
const beltMat = new THREE.MeshStandardMaterial({ color: 0x8a7d6b, roughness: 1 });
const belt = new THREE.InstancedMesh(beltGeo, beltMat, beltCount);
const dummy = new THREE.Object3D();
for (let i = 0; i < beltCount; i++) {
  const a = Math.random() * Math.PI * 2;
  const d = 74 + Math.random() * 10;
  dummy.position.set(Math.cos(a) * d, (Math.random() - .5) * 3, Math.sin(a) * d);
  dummy.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
  dummy.scale.setScalar(0.4 + Math.random() * 1.2);
  dummy.updateMatrix(); belt.setMatrixAt(i, dummy.matrix);
}
scene.add(belt);

// ---------- UI ----------
let paused = false, speedMul = 1;
const pauseBtn = document.getElementById('pauseBtn');
const speedInput = document.getElementById('speed');
const speedVal = document.getElementById('speedVal');
pauseBtn.onclick = () => { paused = !paused; pauseBtn.textContent = paused ? '▶ 재생' : '⏸ 일시정지'; };
speedInput.oninput = () => { speedMul = speedInput.value / 100; speedVal.textContent = speedMul.toFixed(1) + '×'; };

// ---------- 애니메이션 루프 ----------
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .05);
  if (!paused) {
    sun.rotation.y += dt * .05;
    planetObjs.forEach(o => {
      o.pivot.rotation.y += dt * o.data.speed * .35 * speedMul;   // 공전
      o.mesh.rotation.y += dt * o.data.rot * speedMul;             // 자전
      if (o.data.moonPivot) o.data.moonPivot.rotation.y += dt * 2.4 * speedMul;
    });
    belt.rotation.y += dt * .04 * speedMul;
  }
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
